name: Native Android build

# Builds the lone-worker Capacitor Android app. The app loads the deployed
# remote CRM URL, so this only compiles the native shell + plugins (background
# geolocation, push). Triggered manually or when native code changes.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - "native-app/**"
      - "lib/native/**"
      - ".github/workflows/native-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Transistorsoft is a licensed plugin served from a private registry.
      # Provide the auth token as a repo secret so pnpm can resolve it.
      - name: Configure Transistorsoft registry
        env:
          TRANSISTORSOFT_TOKEN: ${{ secrets.TRANSISTORSOFT_TOKEN }}
        run: |
          if [ -n "$TRANSISTORSOFT_TOKEN" ]; then
            printf '@transistorsoft:registry=https://npm.transistorsoft.com/\n' >> .npmrc
            printf '//npm.transistorsoft.com/:_authToken=%s\n' "$TRANSISTORSOFT_TOKEN" >> .npmrc
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add Android platform
        run: pnpm exec cap add android || echo "android platform already added"

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      # Decode the signing keystore (base64 repo secret) for release builds.
      - name: Decode keystore
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for release builds"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build release bundle (AAB)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: native-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: native-app/android
        run: ./gradlew assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.build_type || 'release' }}
          path: |
            native-app/android/app/build/outputs/bundle/release/*.aab
            native-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
